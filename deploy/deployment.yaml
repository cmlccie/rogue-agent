apiVersion: apps/v1
kind: Deployment
metadata:
  name: rogue-agent
  namespace: default
  labels:
    app: rogue-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rogue-agent
  template:
    metadata:
      labels:
        app: rogue-agent
    spec:
      serviceAccountName: rogue-agent
      containers:
        - name: rogue-agent
          image: ghcr.io/cmlccie/rogue-agent:main
          args: ["serve", "--config", "/etc/rogue-agent/config.yaml"]
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          volumeMounts:
            - name: config
              mountPath: /etc/rogue-agent
              readOnly: true
          livenessProbe:
            httpGet:
              path: /api/v1/healthz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 15
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 500m
              memory: 128Mi
      volumes:
        - name: config
          configMap:
            name: rogue-agent
---
apiVersion: v1
kind: Service
metadata:
  name: rogue-agent
  namespace: default
spec:
  selector:
    app: rogue-agent
  ports:
    - port: 8000
      targetPort: 8000
